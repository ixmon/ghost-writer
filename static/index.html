<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostWriter</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ─── Header ──────────────────────────────────────────────── -->
    <header class="app-header">
        <div class="app-logo" onclick="showLibrary()">
            <img src="/static/icons/ghostwriter-icon-ghost-book-black.jpg" class="app-icon" alt="GhostWriter">
            <span>GhostWriter</span>
        </div>
        <div class="header-endpoint" id="llm-header-note"></div>
        <nav class="breadcrumb" id="breadcrumb">
            <a href="#" onclick="showLibrary()">Library</a>
        </nav>
    </header>

    <!-- ─── Main ────────────────────────────────────────────────── -->
    <main class="main-content">

        <!-- Library View -->
        <div id="library-view" class="library-view active">
            <div class="library-header">
                <h1>📚 Library</h1>
                <button class="btn btn-primary" onclick="showGenesisModal()">✨ New Book</button>
            </div>
            <div id="book-grid" class="book-grid">
                <div class="loading">
                    <div class="spinner"></div> Loading books...
                </div>
            </div>
        </div>

        <!-- Book View -->
        <div id="book-view" class="book-view">
            <div id="book-run-status" class="book-run-status" hidden></div>
            <div class="tab-bar">
                <button class="tab-btn active" data-tab="chapters" onclick="switchTab('chapters')">📑 Chapters</button>
                <button class="tab-btn" data-tab="config" onclick="switchTab('config')">⚙️ Config</button>
                <button class="tab-btn" data-tab="reader" onclick="switchTab('reader')">📖 Reader</button>
                <button class="tab-btn" data-tab="console" onclick="switchTab('console')">🖥️ Console</button>
                <button class="tab-btn" data-tab="chat" onclick="switchTab('chat')">💬 Chat</button>
            </div>

            <!-- Chapters Tab -->
            <div id="tab-chapters" class="tab-panel active">
                <div id="chapter-list" class="chapter-list"></div>
            </div>

            <!-- Config Tab -->
            <div id="tab-config" class="tab-panel">
                <div class="config-editor">
                    <nav class="config-nav" id="config-nav"></nav>
                    <div class="config-panel" id="config-panel"></div>
                </div>
            </div>

            <!-- Reader Tab -->
            <div id="tab-reader" class="tab-panel">
                <div id="reader-panel" class="reader-panel"></div>
            </div>

            <!-- Console Tab -->
            <div id="tab-console" class="tab-panel">
                <div class="console-toolbar">
                    <div class="toolbar-group">
                        <label>Command</label>
                        <select id="console-cmd" onchange="onCmdChange()">
                            <option value="compose">✍ Compose</option>
                            <option value="review">📝 Review</option>
                            <option value="revise">🔄 Revise</option>
                            <option value="audit">🔎 Audit</option>
                            <option value="polish">✨ Polish</option>
                            <option value="distill">🧪 Distill</option>
                            <option value="evolve">🧬 Evolve</option>
                            <option value="restructure">🔪 Restructure</option>
                            <option value="pdf">📄 PDF</option>
                        </select>
                    </div>
                    <div class="toolbar-group">
                        <label>Chapter</label>
                        <select id="console-chapter">
                            <option value="">All</option>
                        </select>
                    </div>
                    <div class="toolbar-group" id="strategy-group" style="display:none">
                        <label>Strategy</label>
                        <select id="console-strategy">
                            <option value="general">General</option>
                            <option value="weakest">Weakest Element</option>
                            <option value="dialogue">Dialogue</option>
                            <option value="sensory">Sensory</option>
                            <option value="pacing">Pacing</option>
                            <option value="voice">Voice</option>
                        </select>
                    </div>
                    <div class="toolbar-group" id="polish-score-group" style="display:none">
                        <label>Min Score</label>
                        <input type="number" id="console-min-score" value="80" style="width:60px" />
                    </div>
                    <div class="toolbar-group" id="evolve-mode-group" style="display:none">
                        <label>Mode</label>
                        <select id="console-evolve-mode">
                            <option value="full">Full</option>
                            <option value="expand">Expand</option>
                            <option value="refine">Refine</option>
                        </select>
                    </div>
                    <div class="toolbar-group" id="polish-rounds-group" style="display:none">
                        <label>Rounds</label>
                        <input type="number" id="console-max-rounds" value="3" style="width:50px" />
                    </div>
                    <div class="toolbar-group" id="threshold-group" style="display:none">
                        <label>Threshold</label>
                        <input type="number" id="console-threshold" value="6" style="width:50px"
                            title="Chapters with >= this many key_events will be split" />
                    </div>
                    <div style="flex:1"></div>
                    <div class="console-status" id="console-status">
                        <span class="dot"></span>
                        <span class="label">Ready</span>
                    </div>
                    <button class="btn btn-primary" id="console-run-btn" onclick="consoleRun()">▶ Run</button>
                    <button class="btn btn-danger" id="console-cancel-btn" onclick="consoleCancel()"
                        style="display:none">■ Cancel</button>
                </div>
                <details class="model-details">
                    <summary>Model settings</summary>
                    <div class="model-details-body">
                        <div class="toolbar-group">
                            <label>Host</label>
                            <input type="text" id="console-host" value="127.0.0.1" style="width:160px" />
                        </div>
                        <div class="toolbar-group">
                            <label>Port</label>
                            <input type="number" id="console-port" value="8080" />
                        </div>
                        <div class="toolbar-group">
                            <label>Max Tokens</label>
                            <input type="number" id="console-max-tokens" value="16384" />
                        </div>
                        <div class="toolbar-group">
                            <label>Temp</label>
                            <input type="number" id="console-temp" value="0.88" step="0.05" style="width:70px" />
                        </div>
                    </div>
                </details>
                <div class="console-output" id="console-output">
                    <span class="line line-dim">Select a command and click Run to start...</span>
                </div>
            </div>

            <!-- Chat Tab -->
            <div id="tab-chat" class="tab-panel">
                <div class="chat-container">
                    <div class="chat-messages" id="chat-messages">
                        <div class="chat-welcome">
                            <div class="chat-welcome-icon">💬</div>
                            <h3>Shape the outline</h3>
                            <p>Talk through the plan. When a proposal looks right, accept it to lock that change in.</p>
                            <div class="chat-suggestions" id="chat-welcome-suggestions"></div>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <div class="chat-suggestion-row" id="chat-suggestion-row"></div>
                        <div class="chat-input-row">
                            <textarea id="chat-input" placeholder="Ask about your book..." rows="1"
                                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend()}"
                                oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
                            <button class="chat-send-btn" id="chat-send-btn" onclick="chatSend()">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M22 2L11 13" />
                                    <path d="M22 2L15 22L11 13L2 9L22 2Z" />
                                </svg>
                            </button>
                        </div>
                        <details class="model-details">
                            <summary>Model settings</summary>
                            <div class="chat-settings">
                                <label>Host <input type="text" id="chat-host" value="127.0.0.1" /></label>
                                <label>Port <input type="number" id="chat-port" value="8080" /></label>
                                <label>Temp <input type="number" id="chat-temp" value="0.7" step="0.05" /></label>
                            </div>
                        </details>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- ─── Toasts ──────────────────────────────────────────────── -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Genesis Modal -->
    <div class="modal-overlay" id="genesis-modal"
        style="display:none; position:fixed; inset:0; z-index:1000; align-items:center; justify-content:center; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);">
        <div class="modal-card">
            <div class="modal-header">
                <h2>✨ Create New Book</h2>
                <button class="btn btn-sm" onclick="hideGenesisModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Creative Prompt</label>
                    <textarea id="genesis-prompt" rows="4"
                        placeholder="A cyberpunk heist in Neo-Tokyo, 2087..."></textarea>
                </div>
                <details class="model-details">
                    <summary>Model settings</summary>
                    <div class="form-row">
                        <div class="form-group"><label>Host</label><input type="text" id="genesis-host" value="127.0.0.1" />
                        </div>
                        <div class="form-group"><label>Port</label><input type="number" id="genesis-port" value="8080" />
                        </div>
                    </div>
                </details>
                <div id="genesis-output" class="console-output"
                    style="display:none; min-height:200px; max-height:300px; margin-top:1rem;"></div>
            </div>
            <div class="modal-footer">
                <div class="console-status" id="genesis-status" style="display:none">
                    <span class="dot"></span>
                    <span class="label">Generating...</span>
                </div>
                <button class="btn" onclick="hideGenesisModal()">Cancel</button>
                <button class="btn btn-primary" id="genesis-run-btn" onclick="runGenesis()">✨ Generate</button>
            </div>
        </div>
    </div>

    <script>
        // ─── State ─────────────────────────────────────────────────────
        let currentBook = null;
        let currentChapter = null;
        let readerState = null;
        let stayOnChapter = null;
        let runExitCode = null;
        let currentConfig = null;
        let configPath = null;
        let chaptersData = [];

        // ─── API helpers ───────────────────────────────────────────────
        async function api(path, opts = {}) {
            const res = await fetch(`/api${path}`, {
                headers: { 'Content-Type': 'application/json' },
                ...opts,
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({ detail: res.statusText }));
                throw new Error(err.detail || 'API error');
            }
            return res.json();
        }

        function toast(msg, type = 'success') {
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            document.getElementById('toast-container').appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }

        // ─── Library ───────────────────────────────────────────────────
        async function loadLibrary() {
            const grid = document.getElementById('book-grid');
            try {
                const data = await api('/books');
                if (!data.books.length) {
                    grid.innerHTML = `<div class="empty-state"><div class="icon">📚</div><p>No books found in library</p></div>`;
                    return;
                }
                grid.innerHTML = data.books.map(b => `
            <div class="book-card" onclick="openBook('${b.name}')">
                <div class="title">${esc(b.title)}</div>
                <div class="genre">${esc(b.genre || 'Fiction')}</div>
                <div class="stats">
                    <span class="stat">📑 ${b.chapter_count} chapters</span>
                    <span class="stat">📝 ${formatWords(b.total_words)}</span>
                    ${b.has_config ? '<span class="stat">⚙️ Config</span>' : ''}
                </div>
            </div>
        `).join('');
            } catch (e) {
                grid.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${esc(e.message)}</p></div>`;
            }
        }

        function showLibrary() {
            currentBook = null;
            currentChapter = null;
            renderChatSuggestions();
            document.getElementById('library-view').classList.add('active');
            document.getElementById('book-view').classList.remove('active');
            document.getElementById('book-view').style.display = 'none';
            document.getElementById('library-view').style.display = 'block';
            document.getElementById('breadcrumb').innerHTML = '<a href="#" onclick="showLibrary()">Library</a>';
            loadLibrary();
        }

        // ─── Open Book ─────────────────────────────────────────────────
        async function openBook(name) {
            currentBook = name;
            currentChapter = null;
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('book-view').style.display = 'block';
            document.getElementById('book-view').classList.add('active');

            // Load config
            try {
                const configData = await api(`/books/${name}/config`);
                currentConfig = configData.config;
                configPath = configData.config_path;
            } catch {
                currentConfig = null;
                configPath = null;
            }

            const title = currentConfig?.title || name.replace(/_/g, ' ');
            document.getElementById('breadcrumb').innerHTML = `
        <a href="#" onclick="showLibrary()">Library</a>
        <span class="sep">›</span>
        <span class="current">${esc(title)}</span>
    `;

            // Load chapters
            await loadChapters();

            // Build config editor
            if (currentConfig) buildConfigEditor();

            // Reset to chapters tab
            switchTab('chapters');

            // Reset chat for new book context
            if (typeof chatReset === 'function') chatReset();
        }

        // ─── Chapter config helper ─────────────────────────────────────
        function getChapterConfigs() {
            let ch = currentConfig?.chapters || [];
            // Unwrap double-nesting: chapters: { chapters: [...] }
            if (ch && !Array.isArray(ch) && ch.chapters) {
                ch = ch.chapters;
            }
            return Array.isArray(ch) ? ch : Object.values(ch);
        }

        // ─── Chapters ──────────────────────────────────────────────────
        function chapterStatusLabel(status) {
            if (status === 'planned') return 'not written';
            return status || 'draft';
        }

        function scoreHtml(score) {
            if (score === null || score === undefined || score < 0) return '';
            return `<span class="score-pill${score >= 80 ? ' high' : ''}">${score}</span>`;
        }

        async function loadChapters() {
            const list = document.getElementById('chapter-list');
            try {
                const data = await api(`/books/${currentBook}/chapters`);
                chaptersData = data.chapters;
                if (!chaptersData.length) {
                    list.innerHTML = '<div class="empty-state"><div class="icon">📑</div><p>No chapters in the outline yet. Use Chat to shape the plan.</p></div>';
                    return;
                }

                list.innerHTML = chaptersData.map(c => {
                    const title = c.title || `Chapter ${c.number}`;
                    const words = c.status === 'planned' ? 'Not written' : formatWords(c.word_count);
                    const versions = c.versions > 0
                        ? `<span>${c.versions} version${c.versions > 1 ? 's' : ''}</span>` : '';
                    return `
                <div class="chapter-row" onclick="readChapter(${c.number})">
                    <div class="chapter-num ${esc(c.status)}">${c.number}</div>
                    <div class="chapter-info">
                        <div class="ch-title">${esc(title)}</div>
                        <div class="ch-meta">
                            <span>${words}</span>
                            ${c.pov_character ? `<span>POV: ${esc(c.pov_character)}</span>` : ''}
                            ${scoreHtml(c.score)}
                            ${versions}
                        </div>
                    </div>
                    <div class="chapter-actions">
                        <span class="badge badge-${esc(c.status)}">${esc(chapterStatusLabel(c.status))}</span>
                    </div>
                </div>`;
                }).join('');
            } catch (e) {
                list.innerHTML = `<div class="empty-state"><p>Error: ${esc(e.message)}</p></div>`;
            }
        }

        // ─── Reader ────────────────────────────────────────────────────
        function planColumnHtml(outline) {
            const plan = outline || {};
            const events = (plan.key_events || [])
                .map(event => `<li>${esc(String(event))}</li>`).join('');
            return `
                <aside class="plan-column">
                    <div class="plan-kicker">Locked plan</div>
                    <h3>${esc(plan.title || 'Untitled chapter')}</h3>
                    ${plan.pov_character ? `<div>POV: ${esc(plan.pov_character)}</div>` : ''}
                    ${plan.location ? `<div>${esc(plan.location)}</div>` : ''}
                    ${plan.emotional_beat ? `<div class="plan-kicker">Emotional beat</div><div>${esc(plan.emotional_beat)}</div>` : ''}
                    ${plan.synopsis ? `<div class="plan-kicker">Synopsis</div><div>${esc(plan.synopsis)}</div>` : ''}
                    ${events ? `<div class="plan-kicker">Key events</div><ul>${events}</ul>` : ''}
                </aside>`;
        }

        async function readChapter(num) {
            switchTab('reader');
            currentChapter = parseInt(num);
            renderChatSuggestions();
            const panel = document.getElementById('reader-panel');
            panel.className = 'reader-panel active';
            panel.innerHTML = '<div class="loading"><div class="spinner"></div> Loading...</div>';
            try {
                const data = await api(`/books/${currentBook}/chapters/${num}`);
                let review = null;
                if (data.has_review) {
                    review = await api(`/books/${currentBook}/reviews/${num}`).catch(() => null);
                }
                readerState = {
                    number: data.number,
                    content: data.content || '',
                    exists: data.exists !== false && !!(data.content || '').trim(),
                    versions: data.versions || [],
                    outline: data.outline || {},
                    score: data.score,
                    wordCount: data.word_count || 0,
                    review,
                    viewingVersion: null,
                    editing: false,
                };
                renderReader();
            } catch (e) {
                panel.innerHTML = `<div class="empty-state"><p>${esc(e.message)}</p></div>`;
            }
        }

        function readChapterWithReview(num) {
            return readChapter(num);
        }

        function renderReader() {
            const state = readerState;
            if (!state) return;
            const panel = document.getElementById('reader-panel');
            const title = state.outline.title || `Chapter ${state.number}`;
            const versionOptions = (state.versions || []).map(item =>
                `<option value="${item.version}" ${state.viewingVersion === item.version ? 'selected' : ''}>Version ${item.version}</option>`
            ).join('');
            const banner = state.viewingVersion ? `
                <div class="reader-banner">
                    <span>Viewing version ${state.viewingVersion}. The current chapter stays as it is until you restore this one.</span>
                    <button class="btn btn-sm btn-primary" onclick="restoreChapterVersion(${state.number}, ${state.viewingVersion})">Restore this version</button>
                    <button class="btn btn-sm" onclick="readChapter(${state.number})">Back to current</button>
                </div>` : '';
            const prose = state.editing
                ? `<textarea id="chapter-editor" class="chapter-editor">${esc(state.content)}</textarea>`
                : `<div class="reader-content">${state.content.trim() ? markdownToHtml(state.content) : '<div class="empty-state"><p>This chapter is in the outline and has not been written.</p></div>'}</div>`;
            const editButtons = state.viewingVersion ? '' : (state.editing
                ? `<button class="btn btn-sm btn-primary" onclick="saveChapterEdit(${state.number})">Save</button>
                   <button class="btn btn-sm" onclick="readChapter(${state.number})">Cancel</button>`
                : `<button class="btn btn-sm" onclick="startChapterEdit()">Edit</button>`);
            const runButtons = state.viewingVersion ? '' : `
                <button class="btn btn-sm" onclick="runForChapter('compose', ${state.number})">Compose</button>
                <button class="btn btn-sm" onclick="runForChapter('review', ${state.number})" ${state.exists ? '' : 'disabled'}>Review</button>
                <button class="btn btn-sm" onclick="runForChapter('revise', ${state.number})" ${state.exists ? '' : 'disabled'}>Revise</button>`;
            const reviewScore = state.review ? scoreHtml(state.review.score ?? state.score) : scoreHtml(state.score);
            const reviewColumn = (!state.viewingVersion && state.review) ? `
                <div class="reader-column">
                    <div class="reader-column-header">
                        <span>Review ${reviewScore}</span>
                        <button class="btn btn-sm" onclick="editReview(${state.number})">Edit</button>
                    </div>
                    <div class="review-content" id="review-body">${markdownToHtml(state.review.content || '')}</div>
                </div>` : '';
            panel.innerHTML = `
                <div class="reader-workspace">
                    <div class="reader-toolbar">
                        <strong>Chapter ${state.number}: ${esc(title)}</strong>
                        <span style="color:var(--text-dim)">${state.exists ? formatWords(state.wordCount) : 'Not written'}</span>
                        ${state.viewingVersion ? '' : reviewScore}
                        ${editButtons}
                        ${runButtons}
                        ${versionOptions ? `<select aria-label="Chapter versions" onchange="viewChapterVersion(${state.number}, this.value)"><option value="">Current</option>${versionOptions}</select>` : ''}
                    </div>
                    ${banner}
                    <div class="reader-columns ${reviewColumn ? 'with-review' : ''}">
                        ${planColumnHtml(state.outline)}
                        <div class="reader-column">
                            <div class="reader-column-header">
                                <span>${state.editing ? 'Editing' : (state.viewingVersion ? 'Saved version' : 'Prose')}</span>
                            </div>
                            ${prose}
                        </div>
                        ${reviewColumn}
                    </div>
                </div>`;
        }

        function startChapterEdit() {
            if (!readerState || readerState.viewingVersion) return;
            readerState.editing = true;
            renderReader();
        }

        async function saveChapterEdit(num) {
            const editor = document.getElementById('chapter-editor');
            if (!editor) return;
            try {
                const saved = await api(`/books/${currentBook}/chapters/${num}`, {
                    method: 'PUT',
                    body: JSON.stringify({ content: editor.value }),
                });
                toast(saved.backup ? 'Chapter saved. Previous text kept as a version.' : 'Chapter saved');
                await loadChapters();
                await readChapter(num);
            } catch (e) {
                toast(e.message, 'error');
            }
        }

        async function viewChapterVersion(num, version) {
            if (!version) {
                await readChapter(num);
                return;
            }
            try {
                const data = await api(`/books/${currentBook}/chapters/${num}/versions/${version}`);
                readerState.viewingVersion = parseInt(version, 10);
                readerState.content = data.content || '';
                readerState.wordCount = data.word_count || 0;
                readerState.editing = false;
                renderReader();
            } catch (e) {
                toast(e.message, 'error');
            }
        }

        async function restoreChapterVersion(num, version) {
            try {
                await api(`/books/${currentBook}/chapters/${num}/restore`, {
                    method: 'POST',
                    body: JSON.stringify({ version }),
                });
                toast(`Restored version ${version}`);
                await loadChapters();
                await readChapter(num);
            } catch (e) {
                toast(e.message, 'error');
            }
        }

        function editReview(num) {
            const body = document.getElementById('review-body');
            if (!body || !readerState?.review) return;
            body.innerHTML = `<textarea id="review-editor" class="review-editor">${esc(readerState.review.content || '')}</textarea>
                <div style="padding:0.75rem 1rem">
                    <button class="btn btn-sm btn-primary" onclick="saveReview(${num})">Save</button>
                    <button class="btn btn-sm" onclick="readChapter(${num})">Cancel</button>
                </div>`;
        }

        async function saveReview(num) {
            const editor = document.getElementById('review-editor');
            if (!editor) return;
            try {
                await api(`/books/${currentBook}/reviews/${num}`, {
                    method: 'PUT',
                    body: JSON.stringify({ content: editor.value }),
                });
                toast('Review saved');
                await loadChapters();
                await readChapter(num);
            } catch (e) {
                toast(e.message, 'error');
            }
        }

        // ─── Config Editor ─────────────────────────────────────────────
        const CONFIG_SECTIONS = [
            { id: 'basics', label: '📖 Basics', icon: '' },
            { id: 'setting', label: '🌍 Setting', icon: '' },
            { id: 'characters', label: '👤 Characters', icon: '' },
            { id: 'chapters', label: '📑 Chapters', icon: '' },
            { id: 'events', label: '⚡ Events', icon: '' },
            { id: 'meta', label: '🔧 Meta', icon: '' },
        ];

        function buildConfigEditor() {
            if (!currentConfig) return;
            const nav = document.getElementById('config-nav');
            const panel = document.getElementById('config-panel');

            nav.innerHTML = CONFIG_SECTIONS.map((s, i) => `

        async function generateSynopsis(idx) {
            const chs = getChapterConfigs();
            const ch = chs[idx];
            if (!ch) return;

            const btn = document.querySelector(`.btn-gen-synopsis[data-chap-idx="${idx}"]`);
            const synopsisEl = document.getElementById(`synopsis-${idx}`);
            const eventsEl = document.getElementById(`events-${idx}`);
            if (!synopsisEl || !eventsEl) return;

            // Parse key_events from textarea
            const eventsText = eventsEl.value.trim();
            const keyEvents = eventsText ? eventsText.split('\n').map(l => l.trim()).filter(Boolean) : [];
            if (keyEvents.length === 0) {
                toast('Add some key events first', 'error');
                return;
            }

            // Get other fields from the form
            const title = document.querySelector(`[data-chap="${idx}"][data-field="title"]`)?.value || ch.title || '';
            const pov = document.querySelector(`[data-chap="${idx}"][data-field="pov_character"]`)?.value || ch.pov_character || '';
            const beat = document.querySelector(`[data-chap="${idx}"][data-field="emotional_beat"]`)?.value || ch.emotional_beat || '';
            const loc = document.querySelector(`[data-chap="${idx}"][data-field="location"]`)?.value || ch.location || '';

            btn.textContent = '⏳ Generating...';
            btn.disabled = true;
            synopsisEl.value = '';

            try {
                const resp = await fetch(`/api/books/${currentBook}/generate-synopsis`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chapter_number: ch.number || idx + 1,
                        title, key_events: keyEvents,
                        pov_character: pov, emotional_beat: beat, location: loc,
                    }),
                });

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        try {
                            const evt = JSON.parse(line.slice(6));
                            if (evt.type === 'token') {
                                synopsisEl.value += evt.content;
                            } else if (evt.type === 'error') {
                                toast(evt.content, 'error');
                            }
                        } catch { }
                    }
                }
                toast('Synopsis generated');
            } catch (e) {
                toast(e.message, 'error');
            } finally {
                btn.textContent = '✨ Generate';
                btn.disabled = false;
            }
        }

        // ─── Utilities ─────────────────────────────────────────────────
        function esc(str) {
            if (str == null) return '';
            const d = document.createElement('div');
            d.textContent = String(str);
            return d.innerHTML;
        }

        function toCurlyQuotes(str) {
            if (!str) return str;
            // Convert straight double quotes to curly quotes (opening before non-space, closing otherwise)
            // Using Unicode escapes for maximum compatibility / to avoid encoding issues in the HTML
            return str
                .replace(/"(?=\S)/g, '\u201c')
                .replace(/"(?=\s|$|[.,;:!?…])/g, '\u201d')
                .replace(/"/g, '\u201d');
        }

        function formatWords(n) {
            if (n >= 1000) return (n / 1000).toFixed(1) + 'k words';
            return n + ' words';
        }

        function markdownToHtml(md) {
            if (!md) return '<p style="color: var(--text-dim)">Empty</p>';
            // Simple markdown: paragraphs, bold, italic, headers
            let html = md
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/---/g, '<hr>');

            // Paragraphs
            html = html.split('\n\n').map(p => {
                p = p.trim();
                if (!p) return '';
                if (p.startsWith('<h') || p.startsWith('<hr')) return p;
                return `<p>${p.replace(/\n/g, ' ')}</p>`;
            }).join('\n');

            return html;
        }

        function populateChapterPicker() {
            const sel = document.getElementById('console-chapter');
            sel.innerHTML = '<option value="">All</option>';

            const diskChapters = chaptersData || [];
            const configChapters = getChapterConfigs();

            // Build lookup of chapters that actually exist on disk
            const diskMap = {};
            diskChapters.forEach(ch => {
                diskMap[ch.number] = ch;
            });

            // Collect all chapter numbers from both the on-disk scan and the YAML config
            const allNums = new Set();
            diskChapters.forEach(ch => allNums.add(ch.number));
            configChapters.forEach(ch => {
                const num = parseInt(ch.number);
                if (!isNaN(num)) allNums.add(num);
            });

            // Render in order, marking chapters that have no file yet
            Array.from(allNums).sort((a, b) => a - b).forEach(num => {
                const diskCh = diskMap[num];
                const cfg = configChapters.find(c => parseInt(c.number) === num)
                         || configChapters[num - 1];
                const title = diskCh?.title || cfg?.title || `Chapter ${num}`;

                let label = `${num}. ${esc(title)}`;
                if (!diskCh || diskCh.status === 'planned' || !diskCh.file) {
                    label += ' (not written)';
                }

                sel.innerHTML += `<option value="${num}">${label}</option>`;
            });
        }

        async function consoleRun() {
            if (!currentBook || consoleRunning) return;

            const cmd = document.getElementById('console-cmd').value;
            const chVal = document.getElementById('console-chapter').value;
            const host = document.getElementById('console-host').value;
            const port = parseInt(document.getElementById('console-port').value);
            const maxTokens = parseInt(document.getElementById('console-max-tokens').value);
            const temp = parseFloat(document.getElementById('console-temp').value);

            const body = {
                command: cmd,
                chapter: chVal ? parseInt(chVal) : null,
                host, port,
                max_tokens: maxTokens,
                temperature: temp,
                strategy: document.getElementById('console-strategy').value,
                min_score: parseInt(document.getElementById('console-min-score').value) || 80,
                max_rounds: parseInt(document.getElementById('console-max-rounds').value) || 3,
                evolve_mode: document.getElementById('console-evolve-mode').value,
                threshold: parseInt(document.getElementById('console-threshold').value) || 6,
            };

            const output = document.getElementById('console-output');
            output.innerHTML = '';
            setConsoleState(true);

            const chLabel = chVal ? ` chapter ${chVal}` : '';
            appendLine(`▶ Running: ${cmd}${chLabel} on ${currentBook}`, 'info');
            appendLine(`  host=${host}  port=${port}  max_tokens=${maxTokens}  temp=${temp}`, 'dim');
            appendLine('', 'dim');

            const controller = new AbortController();
            consoleAbort = controller;

            try {
                const res = await fetch(`/api/books/${currentBook}/run`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                    signal: controller.signal,
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const text = line.slice(6);

                            if (text.startsWith('[EXIT:')) {
                                const code = text.match(/\[EXIT:(\d+)\]/)?.[1];
                                runExitCode = code;
                                if (code === '0') {
                                    appendLine('\n✅ Completed successfully', 'success');
                                } else {
                                    appendLine(`\n⚠ Exited with code ${code}`, 'error');
                                }
                                continue;
                            }
                            if (text === '[CANCELLED]') {
                                appendLine('\n■ Cancelled', 'warning');
                                continue;
                            }

                            let cls = '';
                            if (text.includes('✅') || text.includes('✓')) cls = 'success';
                            else if (text.includes('⚠') || text.includes('WARNING')) cls = 'warning';
                            else if (text.includes('ERROR') || text.includes('❌')) cls = 'error';
                            else if (text.includes('📖') || text.includes('✍') || text.includes('📝')) cls = 'info';
                            else if (text.startsWith('   ')) cls = 'dim';

                            appendLine(text, cls);
                        }
                    }
                }
            } catch (e) {
                if (e.name !== 'AbortError') {
                    appendLine(`\n❌ Error: ${e.message}`, 'error');
                }
            } finally {
                const returnTo = stayOnChapter;
                const code = runExitCode;
                stayOnChapter = null;
                runExitCode = null;
                setConsoleState(false);
                await loadChapters();
                if (returnTo != null) {
                    await readChapter(returnTo);
                    if (code && code !== '0') {
                        toast('The run stopped before it finished. The console has the log.', 'error');
                    }
                }
            }
        }

        function runForChapter(cmd, chapter) {
            if (consoleRunning) {
                toast('A command is already running', 'error');
                return;
            }
            stayOnChapter = chapter;
            runExitCode = null;
            document.getElementById('console-cmd').value = cmd;
            onCmdChange();
            populateChapterPicker();
            const chapterSel = document.getElementById('console-chapter');
            for (const opt of chapterSel.options) {
                if (opt.value === String(chapter)) {
                    opt.selected = true;
                    break;
                }
            }
            setTimeout(() => consoleRun(), 100);
        }

        function setConsoleState(running) {
            consoleRunning = running;
            const status = document.getElementById('console-status');
            const runBtn = document.getElementById('console-run-btn');
            const cancelBtn = document.getElementById('console-cancel-btn');

            if (running) {
                status.className = 'console-status running';
                status.querySelector('.label').textContent = 'Running...';
                runBtn.style.display = 'none';
                cancelBtn.style.display = '';
            } else {
                status.className = 'console-status';
                status.querySelector('.label').textContent = 'Ready';
                runBtn.style.display = '';
                cancelBtn.style.display = 'none';
            }
            paintRunStatus();
        }

        function appendLine(text, cls) {
            const output = document.getElementById('console-output');
            const span = document.createElement('span');
            span.className = `line${cls ? ` line-${cls}` : ''}`;
            span.textContent = text;
            output.appendChild(span);
            output.appendChild(document.createTextNode('\n'));
            output.scrollTop = output.scrollHeight;
        }

            const modal = document.getElementById('genesis-modal');
            modal.style.display = 'flex';
            document.getElementById('genesis-prompt').value = '';
            document.getElementById('genesis-output').style.display = 'none';
            document.getElementById('genesis-output').innerHTML = '';
            document.getElementById('genesis-status').style.display = 'none';
            document.getElementById('genesis-run-btn').style.display = '';
            document.getElementById('genesis-prompt').focus();
        }

        function hideGenesisModal() {
            document.getElementById('genesis-modal').style.display = 'none';
        }

        async function runGenesis() {
            const prompt = document.getElementById('genesis-prompt').value.trim();
            if (!prompt) { toast('Enter a creative prompt', 'error'); return; }

            const host = document.getElementById('genesis-host').value;
            const port = parseInt(document.getElementById('genesis-port').value);

            const output = document.getElementById('genesis-output');
            output.style.display = 'block';
            output.innerHTML = '';
            document.getElementById('genesis-status').style.display = 'flex';
            document.getElementById('genesis-status').className = 'console-status running';
            document.getElementById('genesis-run-btn').style.display = 'none';

            const genesisAppend = (text, cls) => {
                const span = document.createElement('span');
                span.className = `line${cls ? ` line-${cls}` : ''}`;
                span.textContent = text;
                output.appendChild(span);
                output.appendChild(document.createTextNode('\n'));
                output.scrollTop = output.scrollHeight;
            };

            genesisAppend(`✨ Generating book from: "${prompt}"`, 'info');
            genesisAppend(`  host=${host}  port=${port}`, 'dim');
            genesisAppend('', 'dim');

            let newBookName = null;

            try {
                const res = await fetch('/api/genesis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, host, port }),
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const text = line.slice(6);

                            const bookMatch = text.match(/\[BOOK:(.+?)\]/);
                            if (bookMatch) {
                                newBookName = bookMatch[1];
                                continue;
                            }
                            if (text.startsWith('[EXIT:')) {
                                const code = text.match(/\[EXIT:(\d+)\]/)?.[1];
                                if (code === '0') {
                                    genesisAppend('\n✅ Genesis complete!', 'success');
                                } else {
                                    genesisAppend(`\n⚠ Exited with code ${code}`, 'error');
                                }
                                continue;
                            }

                            let cls = '';
                            if (text.includes('✅') || text.includes('✓')) cls = 'success';
                            else if (text.includes('⚠')) cls = 'warning';
                            else if (text.includes('ERROR') || text.includes('❌')) cls = 'error';
                            else if (text.startsWith('   ')) cls = 'dim';

                            genesisAppend(text, cls);
                        }
                    }
                }
            } catch (e) {
                genesisAppend(`\n❌ Error: ${e.message}`, 'error');
            } finally {
                document.getElementById('genesis-status').style.display = 'none';
                document.getElementById('genesis-run-btn').style.display = '';
            }

            if (newBookName) {
                toast(`Book "${newBookName}" created!`);
                hideGenesisModal();
                await loadLibrary();
                openBook(newBookName);
            }
        }

        // ─── Chat ───────────────────────────────────────────────────────
        let chatHistory = [];   // { role, content } per book session
        let chatAbort = null;
        let chatStreaming = false;
        let pendingProposal = null;  // staged config proposal

        function chatPromptList() {
            if (currentChapter) {
                const n = currentChapter;
                return [
                    [`What is still missing from chapter ${n}'s outline?`, `What's missing in chapter ${n}?`],
                    [`Propose a tighter synopsis and key events for chapter ${n}.`, `Tighten chapter ${n}'s plan`],
                    [`Where does the draft of chapter ${n} drift from the locked outline?`, `Check chapter ${n} against the plan`],
                ];
            }
            return [
                ['What holes are still in this outline?', 'Find holes in the outline'],
                ['Propose the next chapter this book needs.', 'Propose the next chapter'],
                ['Which character is underused in the plan?', 'Who is underused?'],
            ];
        }

        function fillSuggestionButtons(container) {
            if (!container) return;
            container.innerHTML = chatPromptList().map(([prompt, label]) =>
                `<button type="button">${esc(label)}</button>`
            ).join('');
            const prompts = chatPromptList();
            container.querySelectorAll('button').forEach((button, index) => {
                button.addEventListener('click', () => chatSend(prompts[index][0]));
            });
        }

        function renderChatSuggestions() {
            fillSuggestionButtons(document.getElementById('chat-suggestion-row'));
            fillSuggestionButtons(document.getElementById('chat-welcome-suggestions'));
        }

        function chatReset() {
            chatHistory = [];
            pendingProposal = null;
            const el = document.getElementById('chat-messages');
            el.innerHTML = `
                <div class="chat-welcome">
                    <div class="chat-welcome-icon">💬</div>
                    <h3>Shape the outline</h3>
                    <p>Talk through the plan. When a proposal looks right, accept it to lock that change in.</p>
                    <div class="chat-suggestions" id="chat-welcome-suggestions"></div>
                </div>`;
            renderChatSuggestions();
        }

        function chatAppendMessage(role, content, extra) {
            const el = document.getElementById('chat-messages');
            // Remove welcome on first message
            const welcome = el.querySelector('.chat-welcome');
            if (welcome) welcome.remove();

            const msg = document.createElement('div');
            msg.className = `chat-msg chat-msg-${role}`;

            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble';
            bubble.innerHTML = content;
            msg.appendChild(bubble);

            if (extra) msg.appendChild(extra);
            el.appendChild(msg);
            el.scrollTop = el.scrollHeight;
            return bubble;
        }

        async function chatSend(text) {
            if (chatStreaming || !currentBook) return;
            const input = document.getElementById('chat-input');
            const message = text || input.value.trim();
            if (!message) return;
            input.value = '';
            input.style.height = 'auto';

            // Add user message
            chatHistory.push({ role: 'user', content: message });
            chatAppendMessage('user', escapeHtml(message));

            // Create assistant bubble for streaming
            const assistantBubble = chatAppendMessage('assistant', '<span class="chat-typing">Thinking...</span>');

            chatStreaming = true;
            document.getElementById('chat-send-btn').disabled = true;
            const controller = new AbortController();
            chatAbort = controller;

            const host = document.getElementById('chat-host').value;
            const port = document.getElementById('chat-port').value;
            const temp = parseFloat(document.getElementById('chat-temp').value);

            let fullText = '';
            let toolCalls = [];
            let proposals = [];

            try {
                const resp = await fetch(`/api/books/${currentBook}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: chatHistory,
                        host, port: parseInt(port), temperature: temp,
                    }),
                    signal: controller.signal,
                });

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let startedText = false;

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const dataStr = line.slice(6);
                        let data;
                        try { data = JSON.parse(dataStr); } catch { continue; }

                        if (data.type === 'token') {
                            if (!startedText) {
                                assistantBubble.innerHTML = '';
                                startedText = true;
                            }
                            fullText += data.content;
                            assistantBubble.innerHTML = renderMarkdown(fullText);
                            assistantBubble.closest('.chat-msg').scrollIntoView({ block: 'end', behavior: 'smooth' });
                        }
                        else if (data.type === 'thinking') {
                            if (!startedText) {
                                assistantBubble.innerHTML = '<span class="chat-thinking">🧠 Thinking...</span>';
                            }
                        }
                        else if (data.type === 'tool_call') {
                            const pill = document.createElement('div');
                            pill.className = 'chat-tool-pill';
                            pill.innerHTML = `🔧 <strong>${data.name}</strong>(${Object.values(data.args || {}).join(', ')})`;
                            assistantBubble.appendChild(pill);
                            toolCalls.push(data);
                        }
                        else if (data.type === 'tool_result') {
                            // Silently consumed — the LLM will incorporate this
                        }
                        else if (data.type === 'proposal') {
                            proposals.push(data);
                        }
                        else if (data.type === 'error') {
                            assistantBubble.innerHTML = `<span class="chat-error">❌ ${escapeHtml(data.content)}</span>`;
                        }
                        else if (data.type === 'done') {
                            // Final
                        }
                    }
                }
            } catch (e) {
                if (e.name !== 'AbortError') {
                    assistantBubble.innerHTML = `<span class="chat-error">❌ ${escapeHtml(e.message)}</span>`;
                }
            }

            // Save assistant response to history
            if (fullText) {
                chatHistory.push({ role: 'assistant', content: fullText });
            }

            // Show proposal Apply/Dismiss buttons if any
            for (const p of proposals) {
                const card = document.createElement('div');
                card.className = 'chat-proposal-card';
                const changes = proposalChanges(currentConfig, p.section_data);
                card.innerHTML = `
                    <div class="proposal-header">Proposed outline change</div>
                    <div class="proposal-desc">${escapeHtml(p.description || '')}</div>
                    ${proposalDiffHtml(changes)}
                    <div class="proposal-actions">
                        <button class="btn btn-success proposal-apply">Accept</button>
                        <button class="btn btn-danger proposal-dismiss">Dismiss</button>
                    </div>`;
                assistantBubble.closest('.chat-msg').appendChild(card);

                const applyBtn = card.querySelector('.proposal-apply');
                const dismissBtn = card.querySelector('.proposal-dismiss');

                // Capture proposal data for the closure
                const pSection = p.section;
                const pSectionData = p.section_data;

                applyBtn.addEventListener('click', async () => {
                    if (!pSectionData) {
                        toast('No config data in proposal', 'error');
                        return;
                    }
                    try {
                        await api(`/books/${currentBook}/config`, {
                            method: 'PUT',
                            body: JSON.stringify({ config: pSectionData }),
                        });
                        card.innerHTML = '<div class="proposal-applied">✅ Applied successfully (backup created)</div>';
                        toast('Config updated (backup saved)');
                        // Reload config
                        const resp = await api(`/books/${currentBook}/config`);
                        currentConfig = resp.config;
                        if (currentConfig) buildConfigEditor();
                        await loadChapters();
                        if (currentChapter) await readChapter(currentChapter);
                    } catch (e) {
                        toast(e.message, 'error');
                    }
                });

                dismissBtn.addEventListener('click', () => {
                    card.innerHTML = '<div class="proposal-dismissed">❌ Dismissed</div>';
                });
            }

            chatStreaming = false;
            document.getElementById('chat-send-btn').disabled = false;
            chatAbort = null;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderMarkdown(text) {
            // Simple markdown: bold, italic, code, paragraphs
            return text
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>')
                .replace(/^/, '<p>').replace(/$/, '</p>');
        }

        // ─── Init ──────────────────────────────────────────────────────
        async function applyRuntimeSettings() {
            try {
                const res = await fetch('/api/settings');
                if (!res.ok) return;
                const s = await res.json();
                const setVal = (id, value) => {
                    const el = document.getElementById(id);
                    if (!el || value === undefined || value === null || value === '') return;
                    el.value = value;
                };
                setVal('console-host', s.llm_host);
                setVal('console-port', s.llm_port);
                setVal('console-max-tokens', s.max_tokens);
                setVal('console-temp', s.temperature);
                setVal('chat-host', s.llm_host);
                setVal('chat-port', s.llm_port);
                setVal('genesis-host', s.llm_host);
                setVal('genesis-port', s.llm_port);
                const note = document.getElementById('llm-header-note');
                if (note && s.llm_base_url) {
                    const model = s.llm_model ? ` · ${s.llm_model}` : '';
                    note.textContent = `${s.llm_base_url}${model}`;
                }
            } catch (err) {
                console.warn('GhostWriter settings unavailable', err);
            }
        }

        function normField(value) {
            if (Array.isArray(value)) return value.map(item => String(item)).join('\n');
            if (value == null) return '';
            if (typeof value === 'object') return JSON.stringify(value, null, 2);
            return String(value);
        }

        function chapterIndex(config) {
            const map = new Map();
            let chapters = config?.chapters || [];
            if (chapters && !Array.isArray(chapters) && chapters.chapters) chapters = chapters.chapters;
            if (!Array.isArray(chapters)) chapters = Object.values(chapters || {});
            chapters.forEach((chapter, index) => {
                if (!chapter || typeof chapter !== 'object') {
                    map.set(index + 1, { title: String(chapter || '') });
                    return;
                }
                const number = parseInt(chapter.number, 10) || index + 1;
                map.set(number, chapter);
            });
            return map;
        }

        function proposalChanges(before, after) {
            const changes = [];
            if (!after || typeof after !== 'object') return changes;
            if (!before) {
                return [{ label: 'Outline', before: '', after: normField(after.title || after.synopsis) }];
            }
            for (const key of ['title', 'genre', 'synopsis', 'tone', 'pov']) {
                const oldValue = normField(before[key]);
                const newValue = normField(after[key]);
                if (oldValue !== newValue) changes.push({ label: key, before: oldValue, after: newValue });
            }
            const beforeChapters = chapterIndex(before);
            const afterChapters = chapterIndex(after);
            const numbers = [...new Set([...beforeChapters.keys(), ...afterChapters.keys()])].sort((a, b) => a - b);
            const fields = ['title', 'synopsis', 'pov_character', 'emotional_beat', 'location', 'key_events'];
            for (const number of numbers) {
                const oldChapter = beforeChapters.get(number);
                const newChapter = afterChapters.get(number);
                if (!oldChapter && newChapter) {
                    changes.push({
                        label: `Chapter ${number} added`,
                        before: '',
                        after: normField(newChapter.title || newChapter.synopsis),
                    });
                } else if (oldChapter && !newChapter) {
                    changes.push({
                        label: `Chapter ${number} removed`,
                        before: normField(oldChapter.title),
                        after: '',
                    });
                } else if (oldChapter && newChapter) {
                    for (const field of fields) {
                        const oldValue = normField(oldChapter[field] ?? (field === 'synopsis' ? oldChapter.summary : ''));
                        const newValue = normField(newChapter[field] ?? (field === 'synopsis' ? newChapter.summary : ''));
                        if (oldValue !== newValue) {
                            changes.push({
                                label: `Chapter ${number} ${field.replaceAll('_', ' ')}`,
                                before: oldValue,
                                after: newValue,
                            });
                        }
                    }
                }
            }
            return changes.slice(0, 8);
        }

        function proposalDiffHtml(changes) {
            if (!changes.length) {
                return '<div class="proposal-section">The outline text matches what is already saved.</div>';
            }
            return `<div class="proposal-diff">${changes.map(change => `
                <div class="proposal-diff-row">
                    <div class="proposal-diff-label">${escapeHtml(change.label)}</div>
                    <div class="proposal-diff-before">${escapeHtml(change.before || '—')}</div>
                    <div class="proposal-diff-after">${escapeHtml(change.after || '—')}</div>
                </div>`).join('')}</div>`;
        }

        applyRuntimeSettings();
        renderChatSuggestions();
        loadLibrary();
    </script>
</body>

</html>
